name: Assemble verified 67 managed-workspace fix V2

on:
  push:
    branches: [main]
    paths:
      - '_upload/67-GITHUB-MANAGED-WORKSPACE-FIX-V2.patch.gz.b64'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Assemble and verify V2 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d _upload/67-GITHUB-MANAGED-WORKSPACE-FIX-V2.patch.gz.b64 | gzip -d > 67-GITHUB-MANAGED-WORKSPACE-FIX-V2.patch
          echo "5b587a4e43056af1e0c1b457c516546ce94f4e6658faeff2282530a8ea9da582  67-GITHUB-MANAGED-WORKSPACE-FIX-V2.patch" | sha256sum -c -
          printf '%s  %s\n' "5b587a4e43056af1e0c1b457c516546ce94f4e6658faeff2282530a8ea9da582" "67-GITHUB-MANAGED-WORKSPACE-FIX-V2.patch" > 67-GITHUB-MANAGED-WORKSPACE-FIX-V2.patch.sha256
          rm -rf _upload
          rm -f .github/workflows/assemble-patch.yml
      - name: Commit verified V2 patch and clean transfer files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add verified 67 managed-workspace fix V2"
          git push
