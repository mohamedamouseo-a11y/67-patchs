name: QA V19.5 Artifact

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package V19.5 QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: v19.5-date-control-screenshots
          path: |
            qa/v19.5-date-control/01-v19.5-closed.png
            qa/v19.5-date-control/02-v19.5-open.png
            qa/v19.5-date-control/03-v19.5-panel.png
            qa/v19.5-date-control/04-v19.5-hero-kpi-clearance.png
          if-no-files-found: error
          retention-days: 1
