name: QA V20.2 Artifact

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package V20.2 QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: v20.2-date-filter-screenshots
          path: |
            qa/v20.2-date-filter/01-v20.2-closed.png
            qa/v20.2-date-filter/02-v20.2-open.png
            qa/v20.2-date-filter/03-v20.2-panel-closeup.png
            qa/v20.2-date-filter/04-v20.2-composition.png
          if-no-files-found: error
          retention-days: 1
