name: V43 review artifact

on:
  push:
    paths:
      - '.github/workflows/v43-review-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload V43 screenshots
        uses: actions/upload-artifact@v4
        with:
          name: v43-review-screenshots
          path: qa/v43-three-screen-reference-batch/*.png
          if-no-files-found: error
          retention-days: 1
